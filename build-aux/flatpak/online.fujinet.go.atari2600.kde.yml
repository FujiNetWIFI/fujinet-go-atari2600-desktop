# Flatpak manifest for the KDE frontend.
#
# Self-contained: every input is declared here, so this builds from a plain
# checkout with no preparation steps -- which is also what makes it work
# unchanged in GNOME Builder. The sandbox has no network during the build, so
# anything this file does not declare is simply absent, which makes it the
# strictest test of the clone-and-build promise in the whole project.
#
# TWO dependencies: Stella (the emulator, with its FujiNet cartridge) and
# fujinet-firmware are both provisioned from the pinned commits below, exactly
# as cmake/Dependencies.cmake pins them, so a flatpak build never depends on a
# working checkout's state.
#
# Build + install + run:
#   flatpak-builder --user --install --force-clean build-flatpak \
#       build-aux/flatpak/online.fujinet.go.atari2600.kde.yml
#   flatpak run online.fujinet.go.atari2600.kde
#
app-id: online.fujinet.go.atari2600.kde
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: fujinet-go-atari2600-kde

finish-args:
  - --share=ipc
  - --share=network          # the FujiNet BoIP link + the loopback web UI
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio      # SDL audio (PipeWire's Pulse interface)
  - --device=all             # gamepad hotplug (hidraw/evdev)

modules:
  - name: sdl3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        # keep in step with the SDL the CI jobs build
        tag: release-3.4.12
        commit: f87239e71e42da91ca317a12eefb82cfbf3393eb

  # The FujiNet runtime's vendored build_webui.py imports PyYAML and Jinja2
  # from whatever python3 tools/fujinet/build-fujinet-desktop.sh runs --
  # every CI job's runner already has both system-wide, but org.kde.Sdk's
  # python3 has neither and the sandboxed build step can't pip install them
  # (no network). Pre-built wheels, not sdists: PyYAML and MarkupSafe's C
  # extensions need a build backend pip can't reach offline (jinja2's own
  # backend, flit_core, isn't present either), and a wheel needs none --
  # pip just unpacks it. Pinned to org.kde.Sdk 6.11's python3 (3.13,
  # confirmed from the sandbox's own traceback) x86_64 manylinux wheels;
  # installed to a fixed, python-version-independent path so the
  # fujinet-go-atari2600 module below can just PYTHONPATH at it.
  - name: python3-fujinet-webui-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}"
        --target=/app/fujinet-pyshims PyYAML==6.0.3 MarkupSafe==3.0.3 Jinja2==3.1.6
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/74/27/e5b8f34d02d9995b80abcef563ea1f8b56d20134d8f4e5e81733b1feceb2/pyyaml-6.0.3-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6
      - type: file
        url: https://files.pythonhosted.org/packages/a9/21/9b05698b46f218fc0e118e1f8168395c65c8a2c750ae2bab54fc4bd4e0e8/markupsafe-3.0.3-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl
        sha256: ccfcd093f13f0f0b7fdd0f198b90053bf7b2f02a3927a30e63f3ccc9df56b676
      - type: file
        url: https://files.pythonhosted.org/packages/62/a1/3d680cbfd5f4b8f15abc1d571870c5fc3e594bb582bc3b64ea099db13e56/jinja2-3.1.6-py3-none-any.whl
        sha256: 85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67

  - name: fujinet-go-atari2600
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      env:
        PYTHONPATH: /app/fujinet-pyshims
    config-opts:
      - -DFRONTEND=kde
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          # Every build directory .gitignore's "build*/" covers. `type: dir`
          # takes the working tree INCLUDING gitignored files, and skip does
          # not glob, so each one has to be named -- build-kde was the one
          # that was missing.
          - build
          - build-kde
          - build-flatpak
          - build-flatpak-kde
          # Both provisioned trees: they come from the pinned sources below,
          # so a local checkout's state cannot leak into a flatpak build.
          - third_party/stella
          - third_party/fujinet-firmware
          - tools/fujinet/work
          # The staged Stella tree: regenerated from the pinned source below.
          - core/stella-generated
      # The emulator, pinned exactly as cmake/Dependencies.cmake.
      # a2600_provide_dependency() skips its own fetch once it finds
      # src/emucore/OSystem.cxx (the SENTINEL) already here.
      - type: git
        url: https://github.com/tschak909/stella
        commit: 65bd725e62a6a8ce86acd3e1a01ca8e1cea86ac1
        dest: third_party/stella
      # Pinned exactly as cmake/Dependencies.cmake. a2600_provide_dependency()
      # skips its own fetch once it finds build.sh (the SENTINEL) already here.
      - type: git
        url: https://github.com/FujiNetWIFI/fujinet-firmware
        commit: c68e863034737611415ca568c3ea4607a2220c7e
        dest: third_party/fujinet-firmware
      # Same reasoning: the sandboxed build step has no network access, but
      # tools/fujinet/build-fujinet-desktop.sh needs mbedTLS 3.x and
      # org.kde.Sdk ships none. Pinned to the exact tag/commit the script
      # itself builds when it has to fetch mbedTLS live (ensure_mbedtls's
      # MBEDTLS_TAG) -- ensure_mbedtls skips that fetch once it finds a
      # checkout already here.
      - type: git
        url: https://github.com/Mbed-TLS/mbedtls.git
        tag: mbedtls-3.6.5
        commit: e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df
        dest: tools/fujinet/work/mbedtls-src
